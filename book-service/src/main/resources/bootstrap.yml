# ===========================================
# bootstrap.yml — 引导配置（优先级高于 application.yml）
# 该文件在 Spring Cloud Bootstrap 阶段加载，用于连接 Nacos 配置中心
# ===========================================
spring:
  application:
    name: book-service
  cloud:
    nacos:
      # ---------- Nacos 注册中心 ----------
      discovery:
        server-addr: 127.0.0.1:8848       # Nacos 服务地址
        namespace: public                   # 命名空间（默认 public）
        group: DEFAULT_GROUP
      # ---------- Nacos 配置中心 ----------
      config:
        server-addr: 127.0.0.1:8848
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yaml                # 配置文件格式
        # 共享配置（多个微服务共用的配置）
        shared-configs:
          - data-id: common-config.yaml
            group: DEFAULT_GROUP
            refresh: true                   # 支持动态刷新
